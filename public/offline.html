<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#eaf6fb" />
    <title>GEO is offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at 15% 10%, #ffffff, transparent 35rem),
          #eaf6fb;
        color: #111820;
        font:
          17px/1.6 system-ui,
          sans-serif;
      }
      .card {
        width: min(560px, 100%);
        padding: clamp(32px, 7vw, 64px);
        overflow: hidden;
        border: 1px solid rgba(220, 228, 233, 0.92);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 32px 80px rgba(41, 71, 91, 0.13);
        backdrop-filter: blur(18px);
      }
      .logo {
        display: inline-grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 18px;
        color: white;
        background: #111820;
        font-size: 22px;
        font-weight: 950;
      }
      h1 {
        max-width: 420px;
        margin: 34px 0 18px;
        font-size: clamp(2.6rem, 9vw, 4.5rem);
        line-height: 0.92;
        letter-spacing: -0.07em;
      }
      p {
        color: #68727d;
      }
      a {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        margin-top: 18px;
        padding: 0 20px;
        border-radius: 14px;
        background: #2f63ea;
        color: white;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">G</div>
      <h1>You’re offline—for now.</h1>
      <p>
        The installed app keeps its core interface available. Reconnect to sync
        your account, saved phrases, and latest learning activity.
      </p>
      <a href="/?mode=app#app">Try GEO again</a>
    </main>
  </body>
</html>
