<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#102523" />
    <title>GEO is offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at 15% 10%, #dbe4d4, transparent 35rem),
          #f5f0e7;
        color: #102523;
        font:
          17px/1.6 system-ui,
          sans-serif;
      }
      .card {
        width: min(560px, 100%);
        padding: clamp(32px, 7vw, 64px);
        overflow: hidden;
        border: 1px solid rgba(16, 37, 35, 0.12);
        border-radius: 34px 34px 10px 34px;
        background: rgba(255, 253, 249, 0.84);
        box-shadow: 0 32px 80px rgba(16, 37, 35, 0.15);
        backdrop-filter: blur(18px);
      }
      .logo {
        display: inline-grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 18px;
        color: #102523;
        background: #efb84f;
        font-size: 22px;
        font-weight: 950;
      }
      h1 {
        max-width: 420px;
        margin: 34px 0 18px;
        font-size: clamp(2.6rem, 9vw, 4.5rem);
        line-height: 0.92;
        letter-spacing: -0.07em;
      }
      p {
        color: #60706c;
      }
      a {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        margin-top: 18px;
        padding: 0 20px;
        border-radius: 14px;
        background: #843f58;
        color: white;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">G</div>
      <h1>You’re offline—for now.</h1>
      <p>
        The installed app keeps its core interface available. Reconnect to sync
        your account, saved phrases, and latest learning activity.
      </p>
      <a href="/?mode=app#app">Try GEO again</a>
    </main>
  </body>
</html>
